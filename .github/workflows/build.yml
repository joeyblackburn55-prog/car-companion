name: Build APK

on:
  push:
    branches: [main, 'wip/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk car-companion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: car-companion
          path: car-companion.apk
      - name: Publish to the "latest" release (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest car-companion.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download car-companion.apk and install it on the head unit." \
            --target "$GITHUB_SHA" --prerelease
